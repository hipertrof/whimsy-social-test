<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "Gloock"; src: url("fonts/Gloock-Regular.ttf"); }
      @font-face { font-family: "Lato"; src: url("fonts/Lato-Regular.ttf"); font-weight: 400; }
      @font-face { font-family: "Lato"; src: url("fonts/Lato-Bold.ttf"); font-weight: 700; }
      @font-face { font-family: "Quicksand"; src: url("fonts/Quicksand-VF.ttf"); font-weight: 300 700; }
      :root {
        --midnight: #0b1726;
        --slate: #2a3e59;
        --felt: #bfbfba;
        --ash: #d9c49c;
        --oak: #a6845b;
        --paper: #f2efe8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--midnight); }
      #root { position: relative; width: 100%; height: 100%; }
      .scene { position: absolute; inset: 0; overflow: hidden; font-family: "Lato", sans-serif; }
      .dark { background: var(--midnight); color: var(--paper); }
      .light { background: var(--felt); color: var(--midnight); }
      .pad { position: absolute; left: 84px; right: 84px; }
      h1 { font-family: "Gloock", serif; font-weight: 400; line-height: 1.05; letter-spacing: -0.015em; }
      .mask { display: block; overflow: hidden; padding-bottom: 10px; }
      .line { display: block; }
      .label { font-family: "Quicksand", sans-serif; font-weight: 600; font-size: 30px; letter-spacing: 0.18em; text-transform: uppercase; }
      .dark .label { color: var(--ash); }
      .light .label { color: var(--slate); }
      .photo { position: absolute; overflow: hidden; }
      .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }

      /* 1 — hook (Reels UI covers roughly the top 250 px and bottom 400 px) */
      #r1 h1 { top: 270px; font-size: 84px; }
      #r1 .photo { left: 0; right: 0; top: 660px; height: 860px; background: #fff; }
      #r1 .photo img { object-fit: contain; }

      /* 2 — oak or ash: two cards side by side */
      .wood .photo { top: 420px; width: 444px; height: 420px; border-radius: 28px; background: #fff; }
      .wood .photo img { object-fit: contain; }
      #r2-ash { left: 84px; }
      #r2-oak { left: 552px; }
      .wood .cardlabel { position: absolute; top: 870px; width: 444px; text-align: center; }
      #r2-l-ash { left: 84px; }
      #r2-l-oak { left: 552px; }
      .wood h1 { top: 980px; font-size: 110px; }
      .wood .body { top: 1150px; font-size: 46px; color: var(--slate); }

      /* 3 — end card */
      #r3 .wordmark { top: 680px; text-align: center; font-family: "Gloock", serif; font-size: 170px; }
      #r3 .rule { top: 940px; left: 490px; right: 490px; height: 3px; background: var(--oak); }
      #r3 .sub { top: 1000px; text-align: center; font-family: "Gloock", serif; font-size: 64px; line-height: 1.2; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">

      <section id="r1" class="scene dark clip" data-start="0" data-duration="6.3" data-track-index="0">
        <div class="photo"><img id="r1-img" src="assets/tivi-gray-02.jpg" alt="" /></div>
        <h1 class="pad">
          <span class="mask"><span id="r1-l1" class="line">Każde usłojenie inne.</span></span>
          <span class="mask"><span id="r1-l2" class="line">Najładniejsze ma</span></span>
          <span class="mask"><span id="r1-l3" class="line" style="color: var(--ash)">oczywiście kot.</span></span>
        </h1>
      </section>

      <section id="r2" class="scene light wood clip" data-start="6.3" data-duration="7.6" data-track-index="0">
        <div id="r2-ash" class="photo"><img src="assets/tivi-gray-10.jpg" alt="" /></div>
        <div id="r2-oak" class="photo"><img src="assets/tivi-gray-oak-mid-01.jpg" alt="" /></div>
        <div id="r2-l-ash" class="label cardlabel">jesion</div>
        <div id="r2-l-oak" class="label cardlabel">dąb</div>
        <h1 class="pad"><span class="mask"><span id="r2-h" class="line">Dąb czy jesion?</span></span></h1>
        <div id="r2-b" class="pad body">Przód i tył z litego drewna.</div>
      </section>

      <section id="r3" class="scene dark clip" data-start="13.9" data-duration="6.1" data-track-index="0">
        <div id="r3-mark" class="pad wordmark">whimsy .</div>
        <div id="r3-rule" class="pad rule"></div>
        <div id="r3-sub" class="pad sub">Tivi.<br /><span style="color: var(--ash)">Trochę retro, trochę wow.</span></div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const rise = (sel, t, d = 0.6) => tl.fromTo(sel, { yPercent: 105 }, { yPercent: 0, duration: d, ease: "power3.out" }, t);
      const fade = (sel, t, y = 20) => tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, t);

      // 1 — hook: slow push-in on the wood front. Text in by 1.2 s; 7 words -> 5.1 s reading (MEMORY.md) -> 6.3 s
      tl.fromTo("#r1-img", { scale: 1.0 }, { scale: 1.1, duration: 6.3, ease: "none" }, 0);
      rise("#r1-l1", 0.1);
      rise("#r1-l2", 0.35);
      rise("#r1-l3", 0.6);

      // 2 — ash vs oak. Text in by 1.5 s after 6.3; 11 words -> 6.3 s reading -> ends 13.9
      tl.fromTo("#r2-ash", { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 6.3);
      tl.fromTo("#r2-oak", { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 6.4);
      fade("#r2-l-ash", 6.6, 10);
      fade("#r2-l-oak", 6.7, 10);
      rise("#r2-h", 6.8);
      fade("#r2-b", 7.2);

      // 3 — end card. Text in by 15.1 s; 6 words -> 4.8 s reading -> ends 19.9-20
      fade("#r3-mark", 14.0, 30);
      tl.fromTo("#r3-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 14.3);
      fade("#r3-sub", 14.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
