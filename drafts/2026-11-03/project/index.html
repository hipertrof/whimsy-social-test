<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "Gloock"; src: url("fonts/Gloock-Regular.ttf"); }
      @font-face { font-family: "Lato"; src: url("fonts/Lato-Regular.ttf"); font-weight: 400; }
      @font-face { font-family: "Lato"; src: url("fonts/Lato-Bold.ttf"); font-weight: 700; }
      @font-face { font-family: "Quicksand"; src: url("fonts/Quicksand-VF.ttf"); font-weight: 300 700; }
      :root {
        --midnight: #0b1726;
        --slate: #2a3e59;
        --felt: #bfbfba;
        --ash: #d9c49c;
        --oak: #a6845b;
        --paper: #f2efe8;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--midnight); }
      #root { position: relative; width: 100%; height: 100%; }
      .scene { position: absolute; inset: 0; overflow: hidden; font-family: "Lato", sans-serif; }
      .dark { background: var(--midnight); color: var(--paper); }
      .light { background: var(--felt); color: var(--midnight); }
      .pad { position: absolute; left: 84px; right: 84px; }
      h1 { font-family: "Gloock", serif; font-weight: 400; line-height: 1.05; letter-spacing: -0.015em; }
      .mask { display: block; overflow: hidden; padding-bottom: 10px; }
      .line { display: block; }
      .label { font-family: "Quicksand", sans-serif; font-weight: 600; font-size: 30px; letter-spacing: 0.18em; text-transform: uppercase; }
      .dark .label { color: var(--ash); }
      .light .label { color: var(--slate); }
      .photo { position: absolute; overflow: hidden; }
      .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }

      /* 1 — hook (Reels UI covers roughly the top 250 px and bottom 400 px) */
      #r1 h1 { top: 270px; font-size: 84px; }
      #r1 .photo { left: 0; right: 0; top: 660px; height: 1040px; }

      /* 2 — three models, one footprint: three rows inside y 360–1500 */
      #r2 .label { top: 290px; }
      .row { position: absolute; left: 84px; right: 84px; height: 360px; }
      .row .photo { left: 0; top: 0; width: 460px; height: 360px; border-radius: 28px; background: #fff; }
      .row h1 { position: absolute; left: 510px; top: 95px; font-size: 104px; }
      .row .desc { position: absolute; left: 514px; top: 225px; font-size: 40px; color: var(--slate); }
      #r2a { top: 370px; }
      #r2b { top: 755px; }
      #r2c { top: 1140px; }

      /* 4 — end card */
      #r4 .wordmark { top: 640px; text-align: center; font-family: "Gloock", serif; font-size: 170px; }
      #r4 .sub { top: 900px; text-align: center; font-size: 42px; color: #d6d3cc; }
      #r4 .rule { top: 1010px; left: 490px; right: 490px; height: 3px; background: var(--oak); }
      #r4 .url { top: 1070px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="19.6" data-width="1080" data-height="1920">

      <!-- Timing (MEMORY.md): each scene stays 3 s + 0.3 s per word after its text is fully in.
           r1: 7 words, in by 1.3 s -> 6.4 s. r2: 9 words, in by 1.45 s -> 7.15 s. r4: 6 words, in by 1.2 s -> 6.0 s. -->
      <section id="r1" class="scene dark clip" data-start="0" data-duration="6.4" data-track-index="0">
        <div class="photo"><img id="r1-img" src="assets/barney-gray-03.png" alt="" /></div>
        <h1 class="pad">
          <span class="mask"><span id="r1-l1" class="line">Ten sam metraż.</span></span>
          <span class="mask"><span id="r1-l2" class="line">Trzy charaktery.</span></span>
          <span class="mask"><span id="r1-l3" class="line" style="color: var(--ash)">Czwarty tu rządzi.</span></span>
        </h1>
      </section>

      <section id="r2" class="scene light clip" data-start="6.4" data-duration="7.2" data-track-index="0">
        <div id="r2-label" class="pad label">Każdy: 45 × 50 × 43 cm</div>
        <div id="r2a" class="row">
          <div id="r2a-photo" class="photo"><img src="assets/barney-gray-01.jpg" alt="" /></div>
          <h1><span class="mask"><span id="r2a-h" class="line">Barney</span></span></h1>
          <div id="r2a-d" class="desc">minimalistyczny</div>
        </div>
        <div id="r2b" class="row">
          <div id="r2b-photo" class="photo"><img src="assets/tivi-blue-01.jpg" alt="" /></div>
          <h1><span class="mask"><span id="r2b-h" class="line">Tivi</span></span></h1>
          <div id="r2b-d" class="desc">nostalgiczny</div>
        </div>
        <div id="r2c" class="row">
          <div id="r2c-photo" class="photo"><img src="assets/frodo-blue-01.jpg" alt="" /></div>
          <h1><span class="mask"><span id="r2c-h" class="line">Frodo</span></span></h1>
          <div id="r2c-d" class="desc">zabawny</div>
        </div>
      </section>

      <section id="r4" class="scene dark clip" data-start="13.6" data-duration="6" data-track-index="0">
        <div id="r4-mark" class="pad wordmark">whimsy .</div>
        <div id="r4-sub" class="pad sub">Ręcznie robione w Polsce</div>
        <div id="r4-rule" class="pad rule"></div>
        <div id="r4-url" class="pad label url">whimsyshelters.pl</div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const rise = (sel, t, d = 0.7) => tl.fromTo(sel, { yPercent: 105 }, { yPercent: 0, duration: d, ease: "power3.out" }, t);
      const fade = (sel, t, y = 20) => tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, t);

      // 1 — hook: slow push-in on the interior
      tl.fromTo("#r1-img", { scale: 1.0 }, { scale: 1.12, duration: 6.4, ease: "none" }, 0);
      rise("#r1-l1", 0.1);
      rise("#r1-l2", 0.35);
      rise("#r1-l3", 0.6);

      // 2 — three models: each row slides in, name rises, character fades in
      fade("#r2-label", 6.5);
      [["#r2a", 6.4], ["#r2b", 6.6], ["#r2c", 6.8]].forEach(([id, t]) => {
        tl.fromTo(id + "-photo", { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, t);
        rise(id + "-h", t + 0.15, 0.5);
        fade(id + "-d", t + 0.45);
      });

      // 4 — end card
      fade("#r4-mark", 13.7, 30);
      fade("#r4-sub", 13.95);
      tl.fromTo("#r4-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 14.05);
      fade("#r4-url", 14.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
